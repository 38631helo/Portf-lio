<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfólio de Heloisa Oliveira Martinho - Técnica em Tecnologia da Informação">
  <title>Heloisa Oliveira Martinho | Portfólio</title>

  <!-- Tipografia Comfortaa (Identidade Visual) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Folha de Estilos Principal -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- CURSOR PERSONALIZADO (REFERÊNCIA: ESTHER WONG EM TONS AZUIS) -->
  <div class="cursor-dot" id="cursorDot" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

  <!-- CANVAS DE CORRENTES LUMINOSAS OCEÂNICAS (REFERÊNCIA: IMG1 / OCEANO ABISSAL) -->
  <canvas id="oceanCanvas" class="ocean-canvas" aria-hidden="true"></canvas>

  <!-- ============================================== -->
  <!-- SEÇÃO HERO (TOPO)                              -->
  <!-- ============================================== -->
  <section id="hero" class="hero-section" aria-label="Apresentação inicial">
    <!-- Portal Oceânico / Atmosfera de Fundo (Referência aengel.io) -->
    <div class="ocean-portal" aria-hidden="true">
      <div class="portal-ring ring-1"></div>
      <div class="portal-ring ring-2"></div>
      <div class="portal-ring ring-3"></div>
      <div class="portal-glow"></div>
    </div>

    <!-- Metadados Técnicos Sutis (Estilo aengel.io / Wireframe Abissal) -->
    <div class="hero-coord top-left" aria-hidden="true">
      <span class="coord-dot"></span> PROFUNDIDADE: 240M // ABISSAL
    </div>
    <div class="hero-coord top-right" aria-hidden="true">
      STATUS: ONLINE // BR-SP
    </div>

    <!-- Conteúdo Central da Hero -->
    <div class="hero-container">
      <div class="hero-badge">
        <span class="badge-pulse"></span>
        <span class="badge-text">Técnica em Tecnologia da Informação</span>
      </div>

      <h1 class="hero-title">
        Heloisa Oliveira Martinho
      </h1>

      <p class="hero-subtitle">
        Desenvolvendo soluções digitais que conectam tecnologia, elegância e experiências interativas pelo oceano da web.
      </p>

      <div class="hero-actions">
        <a href="#projetos" class="btn-cta" id="ctaButton">
          <span class="btn-text">Explorar Projetos</span>
          <span class="btn-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </span>
          <span class="btn-glow" aria-hidden="true"></span>
        </a>
      </div>
    </div>

    <!-- Indicador de Navegação Inferior -->
    <div class="hero-scroll-indicator" aria-hidden="true">
      <span class="scroll-label">rolar para navegar</span>
      <div class="scroll-line">
        <span class="scroll-dot"></span>
      </div>
    </div>
  </section>

  <!-- Script Principal -->
  <script src="script.js"></script>
</body>
</html>
